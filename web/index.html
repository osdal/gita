function sanitizeRichHtml(value=""){let doc=new DOMParser().parseFromString(String(value),"text/html");function clean(n){if(n.nodeType===Node.TEXT_NODE)return esc(n.nodeValue||"");if(n.nodeType!==Node.ELEMENT_NODE)return"";let tag=n.tagName.toLowerCase();if(richBlocked.has(tag))return"";let inner=[...n.childNodes].map(clean).join("");if(!richTags.has(tag))return inner;let attrs="";if(tag==="img"){let src=(n.getAttribute("src")||"").trim();try{let u=new URL(src,location.href);if(["http:","https:"].includes(u.protocol)&&u.origin!=="null")attrs+=` src="${esc(u.href)}" alt="${esc((n.getAttribute("alt")||"").slice(0,300))}"`}catch{}}if(tag==="a"){let href=(n.getAttribute("href")||"").trim(),scheme=/^([a-z][a-z0-9+.-]*):/i.exec(href)?.[1]?.toLowerCase();if(href&&(!scheme||["http","https","mailto"].includes(scheme))&&!href.startsWith("//"))attrs+=` href="${esc(href)}"`}let align=/^text-align\s*:\s*(left|center|right|justify)$/i.exec(n.getAttribute("style")||"");if(align)attrs+=` style="text-align:${align[1].toLowerCase()}"`;let classes=(n.getAttribute("class")||"").split(/\s+/).filter(x=>richClasses.has(x));if(classes.length)attrs+=` class="${classes.join(" ")}"`;return richVoid.has(tag)?`<${tag}${attrs}>`:`<${tag}${attrs}>${inner}</${tag}>`}return[...doc.body.childNodes].map(clean).join("")}
function richEditor(id,value="",minHeight=180,poem=false){let raw=String(value||""),initial=/<\/?(?:p|div|br|hr|strong|b|em|i|u|s|del|span|ul|ol|li|blockquote|h[2-4]|a|img)\b/i.test(raw)?sanitizeRichHtml(raw):(poem?formatReadingText(raw):esc(raw).replace(/\r?\n/g,"<br>"));return `<div class="rich-editor"><div class="rich-toolbar" role="toolbar" aria-label="Форматирование текста"><button type="button" data-rich-cmd="bold" title="Жирный"><b>Ж</b></button><button type="button" data-rich-cmd="italic" title="Курсив"><i>К</i></button><button type="button" data-rich-cmd="underline" title="Подчёркнутый"><u>Ч</u></button><button type="button" data-rich-cmd="strikeThrough" title="Зачёркнутый"><s>З</s></button><select data-rich-block title="Стиль абзаца"><option value="p">Обычный текст</option><option value="h2">Заголовок</option><option value="h3">Подзаголовок</option><option value="blockquote">Цитата</option></select><button type="button" data-rich-cmd="insertUnorderedList" title="Маркированный список">• Список</button><button type="button" data-rich-cmd="insertOrderedList" title="Нумерованный список">1. Список</button><button type="button" data-rich-cmd="justifyLeft" title="По левому краю">⇤</button><button type="button" data-rich-cmd="justifyCenter" title="По центру">≡</button><button type="button" data-rich-cmd="justifyRight" title="По правому краю">⇥</button><button type="button" data-rich-cmd="justifyFull" title="По ширине">☰</button><button type="button" data-rich-cmd="createLink" title="Вставить ссылку">↗</button><button type="button" data-rich-image title="Вставить изображение по ссылке">▧ По ссылке</button><button type="button" data-rich-upload title="Загрузить изображение с компьютера">⬆ С компьютера</button><input type="file" data-rich-file accept="image/png,image/jpeg,image/gif,image/webp" hidden><button type="button" data-rich-cmd="removeFormat" title="Убрать форматирование">Очистить</button></div><div id="${esc(id)}" class="rich-content" data-rich-content conte function bindRichEditors(root=document){root.querySelectorAll(".rich-editor").forEach(box=>{if(box.dataset.bound)return;box.dataset.bound="1";let editor=box.querySelector("[data-rich-content]");let fileInput=box.querySelector("[data-rich-file]");box.querySelector("[data-rich-upload]").onclick=()=>fileInput.click();fileInput.onchange=async()=>{let file=fileInput.files?.[0];if(!file)return;if(file.size>8*1024*1024){toast("Размер изображения не должен превышать 8 МБ");fileInput.value="";return}let form=new FormData();form.append("image",file);try{let response=await fetch("/api/admin/images",{method:"POST",headers:{"X-Telegram-Init-Data":initData},body:form}),result=await response.json();if(!response.ok)throw Error(result.error||`Ошибка ${response.status}`);let alt=window.prompt("Описание изображения (необязательно):")||file.name;editor.focus();document.execCommand("insertHTML",false,`<img class="rich-image" src="${esc(result.url)}" alt="${esc(alt)}">`)}catch(error){toast(error.message)}finally{fileInput.value=""}};box.querySelector("[data-rich-image]").onclick=()=>{let url=window.prompt("Введите прямую ссылку на изображение (https://…):");if(!url)return;try{let imageUrl=new URL(url);if(!["http:","https:"].includes(imageUrl.protocol)){toast("Разрешены только ссылки http:// и https://");return}editor.focus();document.execCommand("insertHTML",false,`<img class="rich-image" src="${esc(imageUrl.href)}" alt="${esc(window.prompt("Описание изображения (необязательно):")||"")}">`)}catch{toast("Проверьте ссылку на изображение")}};box.querySelectorAll("[data-rich-cmd]").forEach(button=>{button.onmousedown=e=>e.preventDefault();button.onclick=()=>{editor.focus();let command=button.dataset.richCmd;if(command==="createLink"){let url=window.prompt("Введите URL ссылки:");if(url)document.execCommand(command,false,url)}else document.execCommand(command,false,null)}});let block=box.querySelector("[data-rich-block]");block.onchange=()=>{editor.focus();document.execCommand("formatBlock",false,block.value)}})}
function richValue(id){let editor=$("#"+id);return sanitizeRichHtml(editor?.innerHTML||"")}
function richElementValue(editor){return sanitizeRichHtml(editor?.innerHTML||"")}
function displayRichText(value=""){return /<\/?(?:p|div|br|hr|strong|b|em|i|u|s|del|span|ul|ol|li|blockquote|h[2-4]|a|img)\b/i.test(String(value))?sanitizeRichHtml(value):esc(value)}

function formatReadingText(text=""){let blocks=[],type=null,lines=[],flush=()=>{if(lines.length)blocks.push({type,text:lines.join("\n")});lines=[]};const proseWords=new Set("я ты мы вы он она они его ее их мне меня тебе тебя нам вам это этот эта эти тот та те кто что где когда как чтобы потому поэтому если но или и в во на к ко от до по за из с со о об без для при под над у же все всё был была были быть есть нет может могут должен должна можно себя свое своей свои ему ей ему божественный господь господу господа гуру преданный преданных радхе кришне".split(" "));function style(line,previous){if(/^(?:\[.*\]|—.*—|\(размер.*\))$/i.test(line)||/^[А-ЯЁ\s–—.,:;!?()«»"'-]+$/.test(line)&&/[А-ЯЁ]/.test(line)||/^[А-ЯЁ][а-яё]+(?:-[а-яё]+)+$/.test(line))return"meta";let words=line.toLocaleLowerCase("ru").match(/[\p{L}]+/gu)||[],hits=words.filter(w=>proseWords.has(w)).length,hasTranslitSignals=/(?:[а-яё]+-[а-яё-]+|[йъь])|[āīūṛṅṭḍṇśṣṃḥ]|[a-z]{3,}/i.test(line),startsLower=/^[а-яё]/.test(line),startsUpper=/^[А-ЯЁ]/.test(line);if(hasTranslitSignals&&startsLower)return"verse";if(hits>=2||(hits>=1&&/[.!?;:]/.test(line)&&words.length>4))return"prose";if(previous==="prose")return"prose";if(startsUpper&&words.length>2)return"prose";if(startsLower)return"verse";return previous||"verse"}for(let raw of String(text).split(/\r?\n/)){let line=raw.trim();if(!line){if(type==="verse")continue;flush();type=null;continue}let standalone=/^(?:@+|\(?\d{1,2}\)?[.)]?)$/.test(line);if(standalone){flush();type=null;continue}let attached=/\s(?:@+|\(\d{1,2}\))$/.test(line);if(attached)line=line.replace(/\s(?:@+|\(\d{1,2}\))$/," ").trim();let next=style(line,type);if(type&&next!==type)flush();type=next;lines.push(line);if(attached){flush();type=null}}flush();return blocks.map(b=>`<p class="poem-block poem-${b.type}">${esc(b.text)}</p>`).join("")}
const fontLabels={small:"Маленький",medium:"Средний",large:"Большой"};let fontSize="medium";try{fontSize=localStorage.getItem("pesennik-font-size")||"medium"}catch{}if(!fontLabels[fontSize])fontSize="medium";function setFontSize(size){if(!fontLabels[size])return;fontSize=size;document.body.dataset.fontSize=size;$("#font-label").textContent=fontLabels[size];document.querySelectorAll("[data-font-size]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.fontSize===size)));try{localStorage.setItem("pesennik-font-size",size)}catch{}}
